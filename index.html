<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>아이돌 취향표 만들기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans KR"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            gmarket: ['"GmarketSansBold"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    @font-face {
      font-family: 'GmarketSansBold';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff') format('woff');
      font-weight: 700;
      font-style: normal;
    }
    body {
      background-color: #f7f6fd;
      color: #333333;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center py-6 px-4">

  <!-- 헤더 영역 -->
  <header class="w-full max-w-sm mb-5 text-center">
    <h1 class="text-xl font-bold text-purple-950 font-gmarket tracking-tight">아이돌 취향표 제작기</h1>
    <p class="text-xs text-purple-600 mt-1">이름을 입력하고 사진을 넣어 나만의 취향표를 완성해보세요!</p>
  </header>

  <!-- 이름 입력 카드 -->
  <section class="w-full max-w-sm bg-white rounded-2xl p-4 shadow-sm border border-purple-100 mb-5">
    <label class="block text-xs font-bold text-purple-900 mb-2">최애 / 아이돌 이름</label>
    <div class="relative">
      <input 
        type="text" 
        id="idolNameInput" 
        placeholder="아이돌 이름을 입력하세요"
        maxlength="15"
        class="w-full px-4 py-2.5 bg-purple-50/60 border border-purple-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-400 focus:bg-white transition font-medium"
      >
      <button 
        type="button" 
        id="clearNameBtn" 
        class="absolute right-3 top-1/2 -translate-y-1/2 text-purple-400 hover:text-purple-600 hidden text-xs p-1"
      >
        <i class="fa-solid fa-circle-xmark"></i>
      </button>
    </div>
  </section>

  <!-- 취향표 영역 -->
  <div class="w-full max-w-sm flex justify-center mb-6">
    <div 
      id="tasteChart" 
      class="w-[360px] bg-gradient-to-b from-[#f3f0ff] via-[#f7f5ff] to-[#f0ebff] p-5 rounded-[32px] border-[3px] border-[#e2d9fc] shadow-md relative select-none"
    >
      <!-- 취향표 타이틀 -->
      <div class="text-center pt-3 pb-5">
        <h2 
          id="chartTitle" 
          class="text-[28px] font-gmarket text-[#7c3aed] tracking-tight drop-shadow-sm transition-all"
        >
          최애 취향표
        </h2>
      </div>

      <!-- 1행: 첫인상, 현인상, 모에화 -->
      <div class="grid grid-cols-3 gap-3 mb-5">
        <!-- 첫인상 -->
        <div class="flex flex-col items-center">
          <span class="text-[13px] font-bold text-gray-700 mb-2 font-sans tracking-tight">첫인상</span>
          <label class="slot-container relative w-full aspect-square bg-purple-50/70 border-2 border-purple-200/80 rounded-2xl overflow-hidden cursor-pointer hover:border-purple-400 transition flex items-center justify-center">
            <input type="file" accept="image/*" class="slot-file-input sr-only">
            <div class="empty-state text-purple-300 pointer-events-none">
              <i class="fa-solid fa-plus text-base"></i>
            </div>
            <img class="slot-img w-full h-full object-cover hidden pointer-events-none" alt="">
            <button type="button" class="delete-btn absolute top-1.5 right-1.5 w-6 h-6 bg-black/55 text-white rounded-full text-xs hidden flex items-center justify-center z-20 hover:bg-black/75">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </label>
        </div>

        <!-- 현인상 -->
        <div class="flex flex-col items-center">
          <span class="text-[13px] font-bold text-gray-700 mb-2 font-sans tracking-tight">현인상</span>
          <label class="slot-container relative w-full aspect-square bg-purple-50/70 border-2 border-purple-200/80 rounded-2xl overflow-hidden cursor-pointer hover:border-purple-400 transition flex items-center justify-center">
            <input type="file" accept="image/*" class="slot-file-input sr-only">
            <div class="empty-state text-purple-300 pointer-events-none">
              <i class="fa-solid fa-plus text-base"></i>
            </div>
            <img class="slot-img w-full h-full object-cover hidden pointer-events-none" alt="">
            <button type="button" class="delete-btn absolute top-1.5 right-1.5 w-6 h-6 bg-black/55 text-white rounded-full text-xs hidden flex items-center justify-center z-20 hover:bg-black/75">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </label>
        </div>

        <!-- 모에화 -->
        <div class="flex flex-col items-center">
          <span class="text-[13px] font-bold text-gray-700 mb-2 font-sans tracking-tight">모에화</span>
          <label class="slot-container relative w-full aspect-square bg-purple-50/70 border-2 border-purple-200/80 rounded-2xl overflow-hidden cursor-pointer hover:border-purple-400 transition flex items-center justify-center">
            <input type="file" accept="image/*" class="slot-file-input sr-only">
            <div class="empty-state text-purple-300 pointer-events-none">
              <i class="fa-solid fa-plus text-base"></i>
            </div>
            <img class="slot-img w-full h-full object-cover hidden pointer-events-none" alt="">
            <button type="button" class="delete-btn absolute top-1.5 right-1.5 w-6 h-6 bg-black/55 text-white rounded-full text-xs hidden flex items-center justify-center z-20 hover:bg-black/75">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </label>
        </div>
      </div>

      <!-- 2행: 최애 직캠, 최애 조합 -->
      <div class="grid grid-cols-2 gap-3 mb-5">
        <!-- 최애 직캠 -->
        <div class="flex flex-col items-center">
          <span class="text-[13px] font-bold text-gray-700 mb-2 font-sans tracking-tight">최애 직캠</span>
          <label class="slot-container relative w-full aspect-[4/3] bg-purple-50/70 border-2 border-purple-200/80 rounded-2xl overflow-hidden cursor-pointer hover:border-purple-400 transition flex items-center justify-center">
            <input type="file" accept="image/*" class="slot-file-input sr-only">
            <div class="empty-state text-purple-300 pointer-events-none">
              <i class="fa-solid fa-plus text-base"></i>
            </div>
            <img class="slot-img w-full h-full object-cover hidden pointer-events-none" alt="">
            <button type="button" class="delete-btn absolute top-1.5 right-1.5 w-6 h-6 bg-black/55 text-white rounded-full text-xs hidden flex items-center justify-center z-20 hover:bg-black/75">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </label>
        </div>

        <!-- 최애 조합 -->
        <div class="flex flex-col items-center">
          <span class="text-[13px] font-bold text-gray-700 mb-2 font-sans tracking-tight">최애 조합</span>
          <label class="slot-container relative w-full aspect-[4/3] bg-purple-50/70 border-2 border-purple-200/80 rounded-2xl overflow-hidden cursor-pointer hover:border-purple-400 transition flex items-center justify-center">
            <input type="file" accept="image/*" class="slot-file-input sr-only">
            <div class="empty-state text-purple-300 pointer-events-none">
              <i class="fa-solid fa-plus text-base"></i>
            </div>
            <img class="slot-img w-full h-full object-cover hidden pointer-events-none" alt="">
            <button type="button" class="delete-btn absolute top-1.5 right-1.5 w-6 h-6 bg-black/55 text-white rounded-full text-xs hidden flex items-center justify-center z-20 hover:bg-black/75">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </label>
        </div>
      </div>

      <!-- 3행: 최애 셀카, 최애 무대 -->
      <div class="grid grid-cols-2 gap-3 pb-3">
        <!-- 최애 셀카 -->
        <div class="flex flex-col items-center">
          <span class="text-[13px] font-bold text-gray-700 mb-2 font-sans tracking-tight">최애 셀카</span>
          <label class="slot-container relative w-full aspect-square bg-purple-50/70 border-2 border-purple-200/80 rounded-2xl overflow-hidden cursor-pointer hover:border-purple-400 transition flex items-center justify-center">
            <input type="file" accept="image/*" class="slot-file-input sr-only">
            <div class="empty-state text-purple-300 pointer-events-none">
              <i class="fa-solid fa-plus text-base"></i>
            </div>
            <img class="slot-img w-full h-full object-cover hidden pointer-events-none" alt="">
            <button type="button" class="delete-btn absolute top-1.5 right-1.5 w-6 h-6 bg-black/55 text-white rounded-full text-xs hidden flex items-center justify-center z-20 hover:bg-black/75">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </label>
        </div>

        <!-- 최애 무대 -->
        <div class="flex flex-col items-center">
          <span class="text-[13px] font-bold text-gray-700 mb-2 font-sans tracking-tight">최애 무대</span>
          <label class="slot-container relative w-full aspect-square bg-purple-50/70 border-2 border-purple-200/80 rounded-2xl overflow-hidden cursor-pointer hover:border-purple-400 transition flex items-center justify-center">
            <input type="file" accept="image/*" class="slot-file-input sr-only">
            <div class="empty-state text-purple-300 pointer-events-none">
              <i class="fa-solid fa-plus text-base"></i>
            </div>
            <img class="slot-img w-full h-full object-cover hidden pointer-events-none" alt="">
            <button type="button" class="delete-btn absolute top-1.5 right-1.5 w-6 h-6 bg-black/55 text-white rounded-full text-xs hidden flex items-center justify-center z-20 hover:bg-black/75">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </label>
        </div>
      </div>
    </div>
  </div>

  <!-- 액션 버튼 -->
  <footer class="w-full max-w-sm flex flex-col gap-2.5 pb-8">
    <button 
      type="button" 
      id="downloadBtn" 
      class="w-full py-3.5 bg-[#7c3aed] hover:bg-[#6d28d9] active:scale-[0.98] text-white font-bold rounded-2xl shadow-md shadow-purple-200 flex items-center justify-center gap-2 transition duration-150 text-base"
    >
      <i class="fa-solid fa-download"></i>
      <span>완성본 이미지 저장하기</span>
    </button>
    <button 
      type="button" 
      id="resetAllBtn" 
      class="w-full py-2.5 bg-white hover:bg-gray-50 active:scale-[0.98] text-gray-500 font-medium rounded-xl border border-gray-200 text-xs flex items-center justify-center gap-1.5 transition"
    >
      <i class="fa-solid fa-rotate-left"></i>
      <span>사진 모두 비우기</span>
    </button>
  </footer>

  <script>
    const idolNameInput = document.getElementById('idolNameInput');
    const chartTitle = document.getElementById('chartTitle');
    const clearNameBtn = document.getElementById('clearNameBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const resetAllBtn = document.getElementById('resetAllBtn');
    const slotContainers = document.querySelectorAll('.slot-container');

    // 실시간 제목 반영
    idolNameInput.addEventListener('input', (e) => {
      const val = e.target.value.trim();
      if (val) {
        chartTitle.textContent = `${val} 취향표`;
        clearNameBtn.classList.remove('hidden');
      } else {
        chartTitle.textContent = '최애 취향표';
        clearNameBtn.classList.add('hidden');
      }
    });

    clearNameBtn.addEventListener('click', () => {
      idolNameInput.value = '';
      chartTitle.textContent = '최애 취향표';
      clearNameBtn.classList.add('hidden');
      idolNameInput.focus();
    });

    // 사진 등록 처리
    slotContainers.forEach((container) => {
      const fileInput = container.querySelector('.slot-file-input');
      const img = container.querySelector('.slot-img');
      const emptyState = container.querySelector('.empty-state');
      const deleteBtn = container.querySelector('.delete-btn');

      fileInput.addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            img.src = event.target.result;
            img.classList.remove('hidden');
            emptyState.classList.add('hidden');
            deleteBtn.classList.remove('hidden');
          };
          reader.readAsDataURL(file);
        }
      });

      // 사진 삭제 버튼
      deleteBtn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        fileInput.value = '';
        img.src = '';
        img.classList.add('hidden');
        emptyState.classList.remove('hidden');
        deleteBtn.classList.add('hidden');
      });
    });

    // 전체 비우기
    resetAllBtn.addEventListener('click', () => {
      if (confirm('등록한 사진을 모두 지우시겠습니까?')) {
        slotContainers.forEach((container) => {
          const fileInput = container.querySelector('.slot-file-input');
          const img = container.querySelector('.slot-img');
          const emptyState = container.querySelector('.empty-state');
          const deleteBtn = container.querySelector('.delete-btn');

          fileInput.value = '';
          img.src = '';
          img.classList.add('hidden');
          emptyState.classList.remove('hidden');
          deleteBtn.classList.add('hidden');
        });
      }
    });

    // 고해상도 이미지 다운로드
    downloadBtn.addEventListener('click', async () => {
      const chart = document.getElementById('tasteChart');
      const deleteBtns = chart.querySelectorAll('.delete-btn');
      
      deleteBtns.forEach(btn => btn.style.display = 'none');
      const originalText = downloadBtn.innerHTML;
      downloadBtn.disabled = true;
      downloadBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 저장 중...';

      try {
        const dataUrl = await htmlToImage.toPng(chart, {
          quality: 1.0,
          pixelRatio: 2.5,
          backgroundColor: '#f7f6fd'
        });

        const currentName = idolNameInput.value.trim() || '최애';
        const link = document.createElement('a');
        link.download = `${currentName}_취향표.png`;
        link.href = dataUrl;
        link.click();
      } catch (err) {
        alert('이미지 생성에 실패했습니다. 다시 시도해주세요.');
      } finally {
        deleteBtns.forEach(btn => btn.style.display = '');
        downloadBtn.disabled = false;
        downloadBtn.innerHTML = originalText;
      }
    });
  </script>
</body>
</html>
